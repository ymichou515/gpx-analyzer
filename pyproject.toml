[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx-analyzer"
version = "0.1.0"
description = "Application GTK d'analyse de traces GPX de course à pied"
requires-python = ">=3.9"
dependencies = ["PyGObject>=3.42"]

[project.scripts]
gpx-analyzer = "gpx_analyzer.__main__:main"

[tool.setuptools.packages.find]
include = ["gpx_analyzer*"]
